<!-- =========================
     단원 1: 문서 기본 구조
     설명: HTML 최상단 문서형식과 메타 정보를 정의합니다.
     ========================= -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>예시 페이지</title>
  <!-- CSS 연결: 파일을 같은 디렉터리에 두었다 가정 -->
  <link rel="stylesheet" href="@styles.css" />
</head>

<body>
  <!-- =========================
       단원 2: 헤더 (사이트 제목 및 내비)
       설명: 페이지 최상단의 로고/내비게이션 영역입니다.
       ========================= -->
  <header>
    <!-- 사이트 제목: 접근성(스크린리더)을 위해 h1 사용 -->
    <h1>사이트 제목</h1>
    <!-- 내비게이션: 주요 링크 그룹 -->
    <nav>
      <a href="#home">홈</a>
      <a href="#about">소개</a>
      <a href="#contact">연락처</a>
    </nav>
  </header>

  <!-- =========================
       단원 3: 메인 콘텐츠
       설명: 페이지의 핵심 정보가 들어가는 영역입니다.
       ========================= -->
  <main class="container">
    <section id="home">
      <h2>환영합니다</h2>
      <p>간단한 소개 문장입니다. 주요 메시지를 여기에 적습니다.</p>
      <!-- 버튼 사용 예시 -->
      <a class="btn" href="#contact">문의하기</a>
    </section>
  </main>

  <!-- =========================
       단원 4: 푸터
       설명: 저작권, 연락처 같은 보조 정보 배치
       ========================= -->
  <footer>
    <p>© 2026 예시 회사</p>
  </footer>
</body>
</html>
